# Builds ReadLoud as a static site and publishes it to GitHub Pages.
#
# There is nothing to configure and no secret to add: the app has no server,
# no database and no API keys.
#
# One thing has to be switched on by hand, once, by someone with admin on the
# repository — Settings → Pages → Build and deployment → Source: GitHub
# Actions. A workflow token is not allowed to create a Pages site itself
# ("Resource not accessible by integration"), so until that is done the
# `deploy` job below fails and says so. The `build` job does not depend on it,
# which keeps the signal on the code honest either way.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # So a working branch can be seen live before it is merged. Safe to
      # drop once this is on main.
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a cancelled deploy can
# leave the live site on a half-uploaded artifact.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # postinstall copies the pdf.js worker and the onnxruntime WASM
      # binaries into public/, so they ship from our own origin.
      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - name: Build static export
        run: npm run build:static
        env:
          # A project page is served from /<repo>/, and three URLs the bundler
          # never sees need that prefix. Taken from the repo name rather than
          # from the Pages API so the build does not depend on Pages being on.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # Without this, Pages runs the output through Jekyll, which drops every
      # path beginning with an underscore — which is all of Next's assets.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5
        with:
          # Works where the token is allowed to create the site; where it is
          # not, the next step explains what to click.
          enablement: true

      - name: Explain what is missing
        if: failure() && steps.configure.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not switched on::Open Settings -> Pages, set 'Source' to 'GitHub Actions', then re-run this workflow. A workflow token cannot create the Pages site itself."
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
